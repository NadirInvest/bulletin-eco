name: Bulletin quotidien
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - name: Bulletin quotidien
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        run: python bulletin.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Rubriques (tous les fichiers rubrique_*.py)
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        run: |
          for f in rubrique_*.py; do
            echo "== $f =="
            python "$f" || echo "Échec de $f (les autres rubriques continuent)"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORCER: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Cours de marché
        continue-on-error: true
        run: python marches.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Enregistrer les mises à jour
        run: |
          git config user.name "bulletin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Mise à jour du site" || echo "Rien à enregistrer"
          git pull --rebase
          git push
